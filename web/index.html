<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1b1610">
<meta name="mobile-web-app-capable" content="yes">
<title>Война Королей</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="gfx/build/castle.png" type="image/png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- вход и регистрация -->
<section id="auth" class="screen">
  <div class="auth-box">
    <div class="logo"><img src="gfx3d/ui/logo.webp" alt="Средневековье"></div>
    <h1>Война Королей</h1>
    <div class="seg" id="authTabs">
      <button data-mode="login" class="on">Вход</button>
      <button data-mode="reg">Регистрация</button>
    </div>
    <form id="authForm" autocomplete="on">
      <label>Email / Логин<input name="login" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="40" required></label>
      <label>Пароль<input name="password" type="password" autocomplete="current-password" required></label>
      <label id="nickBox" class="hidden">Придумайте ник <small>(имя в игре, 3–10 символов)</small><input name="nick" autocomplete="nickname" autocapitalize="none" spellcheck="false" maxlength="10"></label>
      <div id="raceBox" class="hidden">
        <div class="label rlabel">Выберите расу:</div>
        <div id="races" class="races"></div>
      </div>
      <div id="capBox" class="hidden"><div class="label">Решите пример</div>
        <div class="capt"><img id="capImg" alt="пример"><button type="button" id="capNew" aria-label="Другой пример">↻</button></div>
        <input name="captcha" type="number" inputmode="numeric" placeholder="Ответ" autocomplete="off"></div>
      <label class="check"><input type="checkbox" name="remember" checked> Запомнить меня</label>
      <div id="lockBox" class="lockbox hidden" role="alert"><div class="lockt1">🔒 Вход временно закрыт</div>
        <div class="lockt2">Три раза введён неверный логин или пароль.<br>Попробуйте через</div><div class="lockt" id="lockT">3:00</div></div>
      <div id="authErr" class="err"></div>
      <button class="btn primary" id="authBtn">Войти</button>
    </form>
    <div id="ver" class="ver"></div>
    <a id="apkLink" class="apklink hidden" href="war-kings.apk" download="war-kings.apk"><img src="gfx3d/ui/android.svg" alt=""> Скачать на Android</a>
  </div>
</section>

<!-- игра: раскладка как в Android-клиенте «Третий Мир 3D» -->
<section id="game" class="screen hidden">
  <header id="top">
    <button id="btnMail" class="env" aria-label="Сообщения"><b id="unread" class="dot hidden"></b></button>
    <button id="btnRep" class="env" aria-label="Отчёты"><b id="unrep" class="dot hidden"></b></button>
    <button id="btnNews" class="env hidden" aria-label="Новость от администрации"><b id="unnews" class="dot hidden"></b></button>
    <button id="mvReinf" class="env mv hidden" data-moves aria-label="Подкрепления"><img src="gfx3d/top/reinf.png" alt=""><b></b></button>
    <button id="mvAtt" class="env mv hidden" data-moves aria-label="Наши нападения"><img src="gfx3d/top/att.png" alt=""><b></b></button>
    <button id="mvInc" class="env mv hidden" data-moves aria-label="Нападения на нас"><img src="gfx3d/top/inc.png" alt=""><b></b></button>
    <button id="mvHome" class="env mv hidden" data-moves aria-label="Армии возвращаются домой"><img src="gfx3d/top/home.png" alt=""><b></b></button>
  </header>
  <div id="stage">
    <main id="view"></main>
    <div id="status"></div>
    <!-- правая выдвижная панель локаций -->
    <aside id="locs">
      <button id="locsTab" aria-label="Панель локаций"></button>
      <div class="lbtns">
        <button data-loc="castle" class="on" aria-label="Замок"><img src="gfx3d/locs2/castle.png" alt=""></button>
        <button data-loc="lands" aria-label="Земли"><img src="gfx3d/locs2/lands.png" alt=""></button>
        <button data-loc="world" aria-label="Мир"><img src="gfx3d/locs2/world.png" alt=""></button>
        <button data-loc="castles" aria-label="Мои замки"><img src="gfx3d/locs2/castles.png" alt=""></button>
        <button data-loc="res" aria-label="Ресурсы"><img src="gfx3d/locs2/res.png" alt=""></button>
      </div>
    </aside>
  </div>
  <footer id="bottom">
    <button id="btnMenu"><img src="gfx/smallicon/softmenu.png" alt=""><span>Меню</span></button>
    <button id="chatline"><span id="clock"></span><span id="chatmsg"></span></button>
    <button id="btnGear" aria-label="Настройки"></button>
  </footer>
</section>

<!-- меню: окно-список над нижней полосой из 7 кнопок -->
<div id="menu" class="hidden">
  <div id="menuWin"></div>
  <nav id="menubar"></nav>
</div>

<div id="backdrop"></div>
<div id="sheet" role="dialog"><div id="sheetBody"></div><button id="sheetBack" aria-label="Назад"></button><button id="sheetClose" aria-label="Закрыть"></button></div>
<div id="toast"></div>
<div id="offline">Нет связи с сервером… переподключение</div>

<script src="app.js"></script>
<script src="mil.js"></script>
<script src="lands_layout.js"></script>
<script src="life.js"></script>
<script src="ui3d.js"></script>
<script src="armies.js"></script>
<script src="quests.js"></script>
<script src="general.js"></script>
<script src="hero.js"></script>
<script src="welcome.js"></script>
<script src="diplomacy.js"></script>
<script src="spy.js"></script>
<script src="residence.js"></script>
<script src="temple.js"></script>
<script src="watch.js"></script>
<script src="forge.js"></script>
<script src="magic.js"></script>
<script src="science.js"></script>
<script src="alliance.js"></script>
<script src="premium.js"></script>
<script src="account.js"></script>
<script src="forum.js"></script>
<script src="dialogs.js"></script>
<script src="news.js"></script>
<script src="sound.js"></script>
</body>
</html>

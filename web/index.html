<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1610">
<meta name="mobile-web-app-capable" content="yes">
<title>Война Королей</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="gfx/build/castle.png" type="image/png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- вход и регистрация -->
<section id="auth" class="screen">
  <div class="auth-box">
    <div class="logo"><img src="gfx/build/castle.png" alt=""></div>
    <h1>Война Королей</h1>
    <p class="muted">Третий Мир · тестовый сервер</p>
    <div class="seg" id="authTabs">
      <button data-mode="login" class="on">Вход</button>
      <button data-mode="reg">Регистрация</button>
    </div>
    <form id="authForm" autocomplete="on">
      <label>Логин<input name="login" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="10" required></label>
      <label>Пароль<input name="password" type="password" autocomplete="current-password" required></label>
      <div id="raceBox" class="hidden">
        <div class="label">Раса</div>
        <div id="races" class="races"></div>
      </div>
      <label class="check"><input type="checkbox" name="remember" checked> Запомнить меня</label>
      <div id="authErr" class="err"></div>
      <button class="btn primary" id="authBtn">Войти</button>
    </form>
  </div>
</section>

<!-- игра -->
<section id="game" class="screen hidden">
  <header id="top">
    <div class="row1">
      <button id="castleName" class="plain"></button>
      <span id="ratingBadge" class="badge">★ 0</span>
    </div>
    <div id="resbar"></div>
    <div id="queue"></div>
  </header>
  <main id="view"></main>
  <nav id="nav">
    <button data-tab="castle" class="on"><i><img src="gfx/build/castle.png" alt=""></i>Замок</button>
    <button data-tab="lands"><i><img src="gfx/build/farm_big.png" alt=""></i>Земли</button>
    <button data-tab="world"><i><img src="gfx/ground/castle_big.png" alt=""></i>Мир</button>
    <button data-tab="rating"><i><img src="gfx/smallicon/status/f_gold.png" alt=""></i>Рейтинг</button>
    <button data-tab="more"><i><img src="gfx/smallicon/softmenu.png" alt=""></i>Ещё<b id="unread" class="dot hidden"></b></button>
  </nav>
</section>

<div id="backdrop"></div>
<div id="sheet" role="dialog"><div class="grab"></div><div id="sheetBody"></div></div>
<div id="toast"></div>
<div id="offline">Нет связи с сервером… переподключение</div>

<script src="app.js"></script>
</body>
</html>

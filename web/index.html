<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Война Королей</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== вход / регистрация ===== -->
<section id="auth" class="screen">
  <div class="auth-box">
    <img class="banner" src="/img/10.png" alt="Война Королей">
    <div class="tabs small">
      <button data-auth="login" class="active">Вход</button>
      <button data-auth="register">Регистрация</button>
    </div>
    <form id="login-form" autocomplete="on">
      <label>Логин <input name="login" required maxlength="10" autocomplete="username"></label>
      <label>Пароль <input name="password" type="password" required autocomplete="current-password"></label>
      <button class="btn primary" type="submit">Войти</button>
    </form>
    <form id="register-form" hidden>
      <label>Логин (3–10 символов) <input name="login" required minlength="3" maxlength="10"></label>
      <label>Пароль <input name="password" type="password" required minlength="3"></label>
      <label>E-mail <input name="email" type="email"></label>
      <label>Раса
        <select name="race">
          <option value="0">Люди — баланс, железо</option>
          <option value="1">Эльфы — защита, дерево</option>
          <option value="2">Гномы — атака, камень</option>
        </select>
      </label>
      <button class="btn primary" type="submit">Создать аккаунт</button>
    </form>
    <p id="auth-msg" class="msg"></p>
    <p class="hint" id="conn-state">Подключение…</p>
  </div>
</section>

<!-- ===== игра ===== -->
<section id="game" class="screen" hidden>
  <header>
    <div class="who"><b id="who-name"></b> <span id="who-race"></span> <span id="who-rating" class="muted"></span></div>
    <div id="resources" class="resources"></div>
    <div class="clock" id="clock"></div>
  </header>
  <nav class="tabs" id="tabs">
    <button data-view="castle" class="active">Замок</button>
    <button data-view="lands">Земли</button>
    <button data-view="world">Мир</button>
    <button data-modal="mail">Почта <span id="unread" class="badge" hidden></span></button>
    <button data-modal="rating">Рейтинг</button>
    <button data-modal="profile">Кабинет</button>
    <button data-modal="bug">Bug!</button>
    <button data-action="logout" class="right">Выход</button>
  </nav>
  <main>
    <div id="map-wrap">
      <canvas id="map"></canvas>
      <div id="map-hint" class="hint">Клик по клетке — выбрать. Перетаскивание — сдвиг, колесо — масштаб.</div>
    </div>
    <aside id="panel">
      <div id="selection"></div>
      <div id="queue"></div>
    </aside>
  </main>
</section>

<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <button class="close" id="modal-close" title="Закрыть">×</button>
    <div id="modal-body"></div>
  </div>
</div>
<div id="toasts"></div>

<script src="app.js"></script>
</body>
</html>
